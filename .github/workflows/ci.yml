name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Format, Lint, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Go formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "ERROR: Unformatted Go source files detected:"
            echo "$UNFORMATTED" | sed 's/^/  - /'
            echo "Run 'make fmt' to reformat before submitting PR."
            exit 1
          fi

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -v -race ./...

      - name: Run end-to-end integration tests
        run: go test -v -race -tags=integration ./test/integration/...

      - name: Run automated installer verification
        run: ./scripts/test-installer.sh

  native-tests:
    name: Native Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # The daemon lifecycle, port-owner lookup, and binary applier have platform-specific
      # implementations (lsof/netstat, Windows rename semantics). Running the race suite natively on
      # macOS and Windows is the only way those branches are exercised.
      - name: Run unit tests with race detector
        shell: bash
        run: go test -race ./...

      - name: Build and smoke-test CLI
        shell: bash
        run: |
          BIN="bin/agw"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="bin/agw.exe"
          fi
          go build -trimpath -o "$BIN" ./cmd/agw
          "$BIN" version

  matrix-build-check:
    name: Cross-Platform Build Check (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify cross-compilation
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          OUT="bin/agw_${{ matrix.os }}_${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            OUT="${OUT}.exe"
          fi
          go build -trimpath -o "$OUT" ./cmd/agw
          rm -f "$OUT"
