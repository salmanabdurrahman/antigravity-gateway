name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version tag (e.g. v0.1.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run unit test suite with race detector
        run: go test -race ./...

      - name: Build cross-platform release archives and checksums
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          case "$TAG" in
            v*) ;;
            *)  TAG="v${TAG}" ;;
          esac
          ./scripts/build-release.sh "$TAG"

      - name: Verify checksum integrity
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      # Artifact smoke checks run before publishing so a broken archive is never released: every
      # unpacked binary must report its own version, and the installer must verify a real asset set.
      - name: Smoke-test packaged binary
        run: |
          set -euo pipefail
          VERSION="$(ls dist/ | sed -n 's/^agw_\([^_]*\)_linux_amd64\.tar\.gz$/\1/p' | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: linux/amd64 release archive missing from dist/" >&2
            ls -1 dist >&2
            exit 1
          fi
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          tar -xzf "dist/agw_${VERSION}_linux_amd64.tar.gz" -C "$WORK"
          chmod +x "$WORK/agw"
          "$WORK/agw" version

      - name: Verify release assets through the installer
        env:
          AGW_DIST_URL: file://${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(ls dist/ | sed -n 's/^agw_\([^_]*\)_.*/\1/p' | head -n1)"
          if [ -z "$RELEASE_VERSION" ]; then
            echo "ERROR: could not determine the packaged release version" >&2
            exit 1
          fi
          INSTALL_ROOT="$(mktemp -d)"
          trap 'rm -rf "$INSTALL_ROOT"' EXIT
          ./scripts/install.sh --version "$RELEASE_VERSION" \
            --dist-url "file://${PWD}/dist" \
            --install-dir "$INSTALL_ROOT/bin"
          "$INSTALL_ROOT/bin/agw" version

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          case "$TAG" in
            v*) ;;
            *)  TAG="v${TAG}" ;;
          esac
          gh release create "${TAG}" dist/* \
            --title "Release ${TAG}" \
            --generate-notes
